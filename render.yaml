# A NOTE ABOUT `sync: false`, WHICH IS LOAD-BEARING HERE
#
# Pushing to main triggers a Blueprint sync, and a sync re-asserts every literal
# value in this file over whatever the services currently hold. That is fine for
# things this file genuinely owns. It is dangerous for two kinds of setting:
#
#  - Anything environment-specific. `DATABASE_ROLE` carries the Supabase pooler
#    tenant suffix, which belongs to one project and cannot be written here.
#  - Anything that decides whether real messages are sent. A literal
#    `PUSH_PROVIDER: mock` in this file will silently downgrade a live
#    integration back to a recording stub on the next push, and nothing will
#    look broken — reminders will simply stop reaching people.
#
# Both classes are `sync: false`: supplied once per environment, and left alone
# by every later sync. This already happened once, taking both services down.

# Render blueprint.
#
# Two services on one image: the HTTP API and the reminder worker. They must
# stay on the same build — the worker enforces the escalation rules the API's
# tests cover, and a version skew between them would mean reminders behaving
# differently from what the app shows.
#
# Every secret is `sync: false`: Render prompts for it once and stores it.
# Nothing sensitive lives in this file.

services:
  - type: web
    name: dawaee-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # free web services sleep after 15 min idle
    region: frankfurt        # closest Render region to Saudi Arabia
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Migrations do NOT run here: Render only allows preDeployCommand on paid
    # instances. They run on the worker instead (see below), and this service
    # fails its health check until the schema it needs exists.
    envVars:
      - key: APP
        value: api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      # Supplied, not derived from a Render database: Postgres is hosted on
      # Supabase. Use the session-mode pooler (port 5432) — Render is IPv4-only
      # and Supabase's direct endpoint is IPv6 on the free tier.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        # Full certificate verification. Never "no-verify": that accepts any
        # certificate from anyone, so anything able to answer for the database
        # host reads and rewrites every query. The service refuses to boot if
        # this is anything else in production.
        value: "true"
      # Supabase documents that verify-full needs their CA (Database Settings ▸
      # SSL Configuration). Set this to that PEM if the endpoint does not chain
      # to a publicly trusted root; leave unset to use the system trust store.
      # sync: false — the value is supplied in the dashboard, not committed.
      - key: DATABASE_CA_CERT
        sync: false
      # The connection string above belongs to the database owner. Requests are
      # served as `dawaee_app`, which owns nothing and cannot bypass RLS.
      #
      # Every shared secret is generated HERE and read by the worker. It has to
      # be one-directional: two services that each read a value from the other
      # form a cycle Render cannot resolve.
      - key: DATABASE_ROLE
        sync: false
      - key: DATABASE_ROLE_PASSWORD
        sync: false
      # The worker's own database password. Generated here for the same reason,
      # used by the worker's pool and by the pre-deploy that sets it in Postgres.
      - key: DAWAEE_WORKER_PASSWORD
        sync: false
      # Render's generated values are shorter than the 48 characters the config
      # requires in production, so this is supplied rather than generated.
      - key: JWT_SECRET
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_DEBUG_ECHO
        value: ""
      # --- providers: leave unset to keep the recording mocks ---
      - key: PUSH_PROVIDER
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: OCR_PROVIDER
        sync: false
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: AZURE_DI_ENDPOINT
        sync: false
      - key: AZURE_DI_KEY
        sync: false
      # Local disk storage is refused at boot in production.
      - key: STORAGE_PROVIDER
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: dawaee-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # background workers have no free plan on Render
    region: frankfurt
    autoDeployTrigger: commit
    # Schema migrations for the whole system run here, before this deploy goes
    # live. Keep them on a paid instance — free instances cannot run them.
    preDeployCommand: ./scripts/migrate.sh
    envVars:
      - key: APP
        value: worker
      - key: NODE_ENV
        value: production
      - key: WORKER_TICK_SECONDS
        value: "60"
      # Supplied, not derived from a Render database: Postgres is hosted on
      # Supabase. Use the session-mode pooler (port 5432) — Render is IPv4-only
      # and Supabase's direct endpoint is IPv6 on the free tier.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        # Full certificate verification. Never "no-verify": that accepts any
        # certificate from anyone, so anything able to answer for the database
        # host reads and rewrites every query. The service refuses to boot if
        # this is anything else in production.
        value: "true"
      # Supabase documents that verify-full needs their CA (Database Settings ▸
      # SSL Configuration). Set this to that PEM if the endpoint does not chain
      # to a publicly trusted root; leave unset to use the system trust store.
      # sync: false — the value is supplied in the dashboard, not committed.
      - key: DATABASE_CA_CERT
        sync: false
      # scripts/migrate.sh runs on this service and is what sets both roles'
      # passwords in Postgres. It reads them from the API rather than generating
      # them, so the value Render hands each service and the value in the
      # database are the same by construction.
      # Supplied rather than cross-referenced: a `fromService` link resolves the
      # value the blueprint generated, not one set afterwards, so an operator
      # rotating a secret on the API would silently leave the worker on the old
      # one — and the worker is what writes these into Postgres.
      - key: DAWAEE_APP_PASSWORD
        sync: false
      - key: DAWAEE_WORKER_PASSWORD
        sync: false
      - key: DATABASE_ROLE
        sync: false
      - key: DATABASE_ROLE_PASSWORD
        sync: false
      # Shared with the API so both sign and verify the same tokens.
      - key: JWT_SECRET
        sync: false
      - key: IP_HASH_SALT
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUSH_PROVIDER
        sync: false
      - key: OCR_PROVIDER
        sync: false
      - key: STORAGE_PROVIDER
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
