# Render blueprint.
#
# Two services on one image: the HTTP API and the reminder worker. They must
# stay on the same build — the worker enforces the escalation rules the API's
# tests cover, and a version skew between them would mean reminders behaving
# differently from what the app shows.
#
# Every secret is `sync: false`: Render prompts for it once and stores it.
# Nothing sensitive lives in this file.

databases:
  # Matches the instance already created in the workspace, so the blueprint
  # links to it instead of trying to create a second one with the same name.
  #
  # NOTE: the `free` plan expires 30 days after creation (2026-10-03 for the
  # current instance) and takes no backups. Move to `basic-256mb` before any
  # real patient data is entered.
  - name: dawaee-db
    databaseName: dawaee_db
    user: dawaee_db_user
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: []          # private network only — never opened to the internet

services:
  - type: web
    name: dawaee-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free               # free web services sleep after 15 min idle
    region: frankfurt        # closest Render region to Saudi Arabia
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Migrations do NOT run here: Render only allows preDeployCommand on paid
    # instances. They run on the worker instead (see below), and this service
    # fails its health check until the schema it needs exists.
    envVars:
      - key: APP
        value: api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase: { name: dawaee-db, property: connectionString }
      - key: DATABASE_SSL
        value: "no-verify"
      # The connection string above belongs to the database owner. Requests are
      # served as `dawaee_app`, which owns nothing and cannot bypass RLS.
      - key: DATABASE_ROLE
        value: dawaee_app
      - key: DATABASE_ROLE_PASSWORD
        fromService: { type: worker, name: dawaee-worker, envVarKey: DAWAEE_APP_PASSWORD }
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_DEBUG_ECHO
        value: "false"
      # --- providers: leave unset to keep the recording mocks ---
      - key: SMS_PROVIDER
        value: mock
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: UNIFONIC_APP_SID
        sync: false
      - key: UNIFONIC_SENDER_ID
        sync: false
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: PUSH_PROVIDER
        value: mock
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: OCR_PROVIDER
        value: mock
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: AZURE_DI_ENDPOINT
        sync: false
      - key: AZURE_DI_KEY
        sync: false
      # Local disk storage is refused at boot in production.
      - key: STORAGE_PROVIDER
        value: r2
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: dawaee-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # background workers have no free plan on Render
    region: frankfurt
    autoDeployTrigger: commit
    # Schema migrations for the whole system run here, before this deploy goes
    # live. Keep them on a paid instance — free instances cannot run them.
    preDeployCommand: ./scripts/migrate.sh
    envVars:
      - key: APP
        value: worker
      - key: NODE_ENV
        value: production
      - key: WORKER_TICK_SECONDS
        value: "60"
      - key: DATABASE_URL
        fromDatabase: { name: dawaee-db, property: connectionString }
      - key: DATABASE_SSL
        value: "no-verify"
      # These two are generated here and nowhere else: scripts/migrate.sh runs
      # on this service and is what sets the roles' passwords in Postgres, so
      # the value Render generates and the value in the database are the same
      # by construction. The API reads DAWAEE_APP_PASSWORD from this service.
      - key: DAWAEE_APP_PASSWORD
        generateValue: true
      - key: DAWAEE_WORKER_PASSWORD
        generateValue: true
      - key: DATABASE_ROLE
        value: dawaee_worker
      - key: DATABASE_ROLE_PASSWORD
        fromService: { type: worker, name: dawaee-worker, envVarKey: DAWAEE_WORKER_PASSWORD }
      # Shared with the API so both sign and verify the same tokens.
      - key: JWT_SECRET
        fromService: { type: web, name: dawaee-api, envVarKey: JWT_SECRET }
      - key: IP_HASH_SALT
        fromService: { type: web, name: dawaee-api, envVarKey: IP_HASH_SALT }
      - key: PUBLIC_APP_URL
        sync: false
      - key: SMS_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: r2
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
