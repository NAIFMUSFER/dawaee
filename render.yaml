# Render blueprint.
#
# Two services on one image: the HTTP API and the reminder worker. They must
# stay on the same build — the worker enforces the escalation rules the API's
# tests cover, and a version skew between them would mean reminders behaving
# differently from what the app shows.
#
# Every secret is `sync: false`: Render prompts for it once and stores it.
# Nothing sensitive lives in this file.

databases:
  - name: dawaee-db
    databaseName: dawaee
    user: dawaee_owner
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []          # private network only

services:
  - type: web
    name: dawaee-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt        # closest Render region to Saudi Arabia
    healthCheckPath: /health
    autoDeployTrigger: commit
    # Migrations run before the new version takes traffic.
    preDeployCommand: ./scripts/migrate.sh
    envVars:
      - key: APP
        value: api
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase: { name: dawaee-db, property: connectionString }
      - key: DATABASE_SSL
        value: "no-verify"
      - key: JWT_SECRET
        generateValue: true
      - key: IP_HASH_SALT
        generateValue: true
      - key: PUBLIC_APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OTP_DEBUG_ECHO
        value: "false"
      # --- providers: leave unset to keep the recording mocks ---
      - key: SMS_PROVIDER
        value: mock
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: UNIFONIC_APP_SID
        sync: false
      - key: UNIFONIC_SENDER_ID
        sync: false
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: PUSH_PROVIDER
        value: mock
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: OCR_PROVIDER
        value: mock
      - key: GOOGLE_VISION_API_KEY
        sync: false
      - key: AZURE_DI_ENDPOINT
        sync: false
      - key: AZURE_DI_KEY
        sync: false
      # Local disk storage is refused at boot in production.
      - key: STORAGE_PROVIDER
        value: r2
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false

  - type: worker
    name: dawaee-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    autoDeployTrigger: commit
    envVars:
      - key: APP
        value: worker
      - key: NODE_ENV
        value: production
      - key: WORKER_TICK_SECONDS
        value: "60"
      - key: DATABASE_URL
        fromDatabase: { name: dawaee-db, property: connectionString }
      - key: DATABASE_SSL
        value: "no-verify"
      # Shared with the API so both sign and verify the same tokens.
      - key: JWT_SECRET
        fromService: { type: web, name: dawaee-api, envVarKey: JWT_SECRET }
      - key: IP_HASH_SALT
        fromService: { type: web, name: dawaee-api, envVarKey: IP_HASH_SALT }
      - key: PUBLIC_APP_URL
        sync: false
      - key: SMS_PROVIDER
        value: mock
      - key: WHATSAPP_PROVIDER
        value: mock
      - key: PUSH_PROVIDER
        value: mock
      - key: OCR_PROVIDER
        value: mock
      - key: STORAGE_PROVIDER
        value: r2
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
