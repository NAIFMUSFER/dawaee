apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'app.dawaee.exactalarm'
version = '0.1.0'

expoModule {
  canBePublished false
}

android {
  namespace "app.dawaee.exactalarm"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Reuse Expo's persisted-notification restore path (also used after reboot)
  // so the permission-grant receiver can repair alarms without launching JS.
  implementation project(':expo-notifications')
}
