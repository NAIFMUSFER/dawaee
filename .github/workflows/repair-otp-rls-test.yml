name: Repair OTP RLS expectation

on:
  push:
    branches: [hotfix/otp-rls-2026-09-06]
    paths: [.github/workflows/repair-otp-rls-test.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: hotfix/otp-rls-2026-09-06
      - name: Remove the obsolete bare-table expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/test/definer-privilege-model.test.ts')
          s = p.read_text()
          old = "      'auth_otp_challenges',      // reached only through app.issue_otp / app.verify_otp\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one stale OTP expectation, found {s.count(old)}')
          p.write_text(s.replace(old, ''))
          PY
          git diff --check
          if grep -Fq "'auth_otp_challenges',      // reached only through app.issue_otp / app.verify_otp" apps/api/test/definer-privilege-model.test.ts; then
            echo 'stale expectation remains' >&2
            exit 1
          fi
      - name: Commit repair and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-otp-rls-test.yml
          git add apps/api/test/definer-privilege-model.test.ts
          git diff --cached --check
          git commit -m 'test: treat OTP challenges as RLS protected'
          git push origin HEAD:hotfix/otp-rls-2026-09-06
