name: Audit one-shot inventory patch

on:
  push:
    branches:
      - audit/e2e-red-white-black-2026-09-09

permissions:
  contents: write

jobs:
  patch-inventory:
    if: ${{ !contains(github.event.head_commit.message, '[audit-inventory-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Patch endpoint authorization inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/api/test/endpoint-authorization.test.ts')
          s = p.read_text()
          needle = "  'PUT /v1/caregivers/:relationshipId/notification-rules': 'authenticated',\n"
          if needle not in s:
              raise SystemExit('expected caregiver inventory anchor missing')
          addition = needle + "\n  // Privacy-preserving caregiver mutations keep the stable relationship id in\n  // the JSON body so Render request-path logs cannot retain it. They remain\n  // authenticated and preserve the same owner/RLS checks as the legacy routes.\n  'PATCH /v1/caregivers/permissions': 'authenticated',\n  'PUT /v1/caregivers/notification-rules': 'authenticated',\n  'POST /v1/caregivers/revoke': 'authenticated',\n"
          if "'PATCH /v1/caregivers/permissions': 'authenticated'" not in s:
              s = s.replace(needle, addition, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit the evidence-backed fix
        shell: bash
        run: |
          git rm .github/workflows/audit-inventory-self-patch.yml
          git add apps/api/test/endpoint-authorization.test.ts
          git config user.name "Dawaee Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "test(audit): classify fixed-path caregiver routes [audit-inventory-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
