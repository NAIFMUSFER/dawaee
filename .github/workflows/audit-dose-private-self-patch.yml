name: Audit one-shot dose privacy cutover

on:
  push:
    branches:
      - audit/e2e-red-white-black-2026-09-09

permissions:
  contents: write

jobs:
  patch-dose-transport:
    if: ${{ !contains(github.event.head_commit.message, '[audit-dose-private-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Cut current clients over to fixed-path dose actions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Register the already-added fixed-path API module.
          p = Path('apps/api/src/server.ts')
          s = p.read_text()
          imp = "import { registerDoseRoutes } from './routes/doses.js';\n"
          reg = "    registerDoseRoutes(scope);\n"
          if "registerDosePrivateRoutes" not in s:
              assert imp in s and reg in s
              s = s.replace(imp, imp + "import { registerDosePrivateRoutes } from './routes/dose-private.js';\n", 1)
              s = s.replace(reg, reg + "    registerDosePrivateRoutes(scope);\n", 1)
          p.write_text(s)

          # Keep the new route inside the endpoint-wide auth inventory.
          p = Path('apps/api/test/endpoint-authorization.test.ts')
          s = p.read_text()
          anchor = "  'POST /v1/doses/sync': 'authenticated',\n"
          if "'POST /v1/dose/action': 'authenticated'" not in s:
              assert anchor in s
              s = s.replace(anchor, anchor + "  // Fixed path: dose id and action live in authenticated JSON, not Render's request path.\n  'POST /v1/dose/action': 'authenticated',\n", 1)
          p.write_text(s)

          # Today screen: online actions use the generic fixed path. Offline replay
          # already uses /v1/doses/sync and therefore needs no change.
          p = Path('apps/mobile/app/(tabs)/today.tsx')
          s = p.read_text()
          replacements = {
            "await api.post(`/v1/doses/${dose.id}/undo`, {});": "await api.post('/v1/dose/action', { doseId: dose.id, action: 'undo' });",
            "await api.post(`/v1/doses/${dose.id}/taken`, { clientEventId, method: 'app', deviceId, takenAt: at });": "await api.post('/v1/dose/action', { doseId: dose.id, action: 'taken', clientEventId, method: 'app', deviceId, takenAt: at });",
            "await api.post(`/v1/doses/${dose.id}/skip`, { clientEventId, deviceId });": "await api.post('/v1/dose/action', { doseId: dose.id, action: 'skip', clientEventId, deviceId });",
            "await api.post(`/v1/doses/${dose.id}/snooze`, { minutes, clientEventId, deviceId });": "await api.post('/v1/dose/action', { doseId: dose.id, action: 'snooze', minutes, clientEventId, deviceId });",
          }
          for old, new in replacements.items():
              assert old in s, f'missing Today anchor: {old}'
              s = s.replace(old, new, 1)
          p.write_text(s)

          # Lock-screen notification actions must use the same transport or the
          # privacy fix would fail whenever the app is backgrounded.
          p = Path('apps/mobile/src/notifications/actions.ts')
          s = p.read_text()
          replacements = {
            "await api.post(`/v1/doses/${doseId}/taken`, {\n        clientEventId, method: 'push_action', deviceId, takenAt: at,\n      });": "await api.post('/v1/dose/action', {\n        doseId, action: 'taken', clientEventId, method: 'push_action', deviceId, takenAt: at,\n      });",
            "await api.post(`/v1/doses/${doseId}/skip`, { clientEventId, deviceId });": "await api.post('/v1/dose/action', { doseId, action: 'skip', clientEventId, deviceId });",
            "await api.post(`/v1/doses/${doseId}/snooze`, {\n        minutes: QUICK_SNOOZE_MINUTES, clientEventId, deviceId,\n      });": "await api.post('/v1/dose/action', {\n        doseId, action: 'snooze', minutes: QUICK_SNOOZE_MINUTES, clientEventId, deviceId,\n      });",
          }
          for old, new in replacements.items():
              assert old in s, f'missing notification anchor: {old}'
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit cutover
        shell: bash
        run: |
          git rm .github/workflows/audit-dose-private-self-patch.yml
          git add apps/api/src/server.ts apps/api/test/endpoint-authorization.test.ts 'apps/mobile/app/(tabs)/today.tsx' apps/mobile/src/notifications/actions.ts
          git config user.name "Dawaee Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(audit): cut dose actions over to fixed path [audit-dose-private-patched]"
          git push origin HEAD:${GITHUB_REF_NAME}
