name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5433'
      PGUSER: postgres
      PGPASSWORD: postgres
      DAWAEE_APP_PASSWORD: devpass
      DAWAEE_WORKER_PASSWORD: devpass
      DATABASE_URL: postgres://dawaee_app:devpass@127.0.0.1:5433/dawaee_test
      WORKER_DATABASE_URL: postgres://dawaee_worker:devpass@127.0.0.1:5433/dawaee_test
      JWT_SECRET: ci_secret_at_least_thirty_two_characters_long_0123456789
      IP_HASH_SALT: ci-salt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm ci

      - name: Build workspace packages
        run: npx tsc -b packages/shared packages/core apps/api apps/worker

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: |
          npx tsc -p apps/api/tsconfig.json --noEmit
          npx tsc -p apps/worker/tsconfig.json --noEmit

      - name: Prepare test database
        run: |
          ./scripts/db-reset.sh dawaee_test
          ./scripts/db-bootstrap-roles.sh dawaee_test

      # The adversarial RLS probe runs on its own. It asserts that patient A
      # cannot reach patient B by any route the database exposes, and a single
      # FAIL line is a release blocker.
      - name: Row-level security probe
        run: |
          set -o pipefail
          psql -d dawaee_test -f db/seed/rls_probe.sql | tee /tmp/rls.txt
          if grep -q '^ FAIL' /tmp/rls.txt; then
            echo "::error::row-level security probe failed"
            exit 1
          fi

      # Production runs migrations as an ordinary database owner, never a
      # superuser. That difference has already hidden two failures that only
      # appear on deploy, so CI reproduces it: a non-superuser owner, a fresh
      # database, migrations applied twice (the second run must be a no-op),
      # and the RLS probe against the result.
      - name: Migrations as a non-superuser owner
        run: |
          set -euo pipefail
          psql -d postgres -c "CREATE ROLE ci_owner LOGIN CREATEDB CREATEROLE PASSWORD 'ciownerpw'"
          psql -d postgres -c "CREATE DATABASE dawaee_ci OWNER ci_owner"
          export DATABASE_URL="postgres://ci_owner:ciownerpw@127.0.0.1:5433/dawaee_ci"
          export DAWAEE_APP_PASSWORD=cipass DAWAEE_WORKER_PASSWORD=cipass
          ./scripts/migrate.sh
          ./scripts/migrate.sh | tee /tmp/second.txt
          grep -q 'no pending migrations' /tmp/second.txt || { echo "::error::re-running migrations was not a no-op"; exit 1; }
          psql -d dawaee_ci -f db/seed/rls_probe.sql | tee /tmp/rls-ci.txt
          if grep -q '^ FAIL' /tmp/rls-ci.txt; then
            echo "::error::row-level security probe failed on a non-superuser-owned database"
            exit 1
          fi

      - name: Unit and integration tests
        run: npm test

      - name: Mobile typecheck
        working-directory: apps/mobile
        run: |
          npm ci --legacy-peer-deps
          npx tsc --noEmit

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Proves the deploy artifact still builds; the API and worker share it.
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
