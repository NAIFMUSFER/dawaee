name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

# Read-only by default, at the top level, so a job that needs more has to say
# so. Without this block a workflow inherits whatever the repository default
# is — which for repositories created before 2023 is read/write on everything,
# meaning any compromised action in any step could push to main.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Production runs PostgreSQL 17 (Supabase). CI ran only 16, so every
        # security property this suite proves was proven against a version the
        # patients' data does not live on. 17 is the one that must pass; 16 is
        # kept because it is what a developer has locally, and a divergence
        # between them is itself worth seeing.
        postgres: ['17', '16']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      PGHOST: 127.0.0.1
      PGPORT: '5433'
      PGUSER: postgres
      PGPASSWORD: postgres
      DAWAEE_APP_PASSWORD: devpass
      DAWAEE_WORKER_PASSWORD: devpass
      DATABASE_URL: postgres://dawaee_app:devpass@127.0.0.1:5433/dawaee_test
      WORKER_DATABASE_URL: postgres://dawaee_worker:devpass@127.0.0.1:5433/dawaee_test
      # Test values, not secrets. They are literals on purpose: a CI run that
      # needed a real secret would be a run a fork could not reproduce, and
      # would put production credentials one workflow bug away from a log.
      JWT_SECRET: ci_secret_at_least_thirty_two_characters_long_0123456789
      IP_HASH_SALT: ci-salt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Record the toolchain actually in use
        run: |
          echo "node $(node --version), npm $(npm --version)"
          echo "postgres client: $(psql --version 2>/dev/null || echo 'not yet installed')"

      - name: Install PostgreSQL client matching the server
        # The client must be at least the server's major version, or
        # `pg_dump`/`psql` meta-commands can behave differently against 17.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y "postgresql-client-${{ matrix.postgres }}"
          psql --version

      - run: npm ci

      - name: Build workspace packages
        run: npx tsc -b packages/shared packages/core apps/api apps/worker

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      # The database is owned by `dawaee_migrator`, which is NOSUPERUSER and
      # NOBYPASSRLS. Until P18 this was owned by `postgres`, so every `app.*`
      # SECURITY DEFINER function ran with an unconditional row-level-security
      # bypass that no managed PostgreSQL grants — and the entire suite proved
      # its properties against a configuration production does not have.
      # Registration was broken on a realistic owner while 1013 tests passed.
      - name: Prepare test database (realistic ownership)
        run: ./scripts/db-reset.sh dawaee_test

      - name: The test database owner must not be able to bypass RLS
        run: |
          set -euo pipefail
          attrs="$(psql -tAc "SELECT rolsuper::text || ' ' || rolbypassrls::text FROM pg_roles WHERE rolname = 'dawaee_migrator'")"
          [ "$attrs" = "false false" ] || { echo "::error::migration owner is $attrs, so every RLS test is vacuous"; exit 1; }
          owner="$(psql -tAc "SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = 'dawaee_test'")"
          [ "$owner" = "dawaee_migrator" ] || { echo "::error::dawaee_test is owned by $owner"; exit 1; }

      # The adversarial RLS probe runs on its own. It asserts that patient A
      # cannot reach patient B by any route the database exposes, and a single
      # FAIL line is a release blocker.
      - name: Row-level security probe
        run: |
          set -o pipefail
          psql -d dawaee_test -f db/seed/rls_probe.sql | tee /tmp/rls.txt
          if grep -q '^ FAIL' /tmp/rls.txt; then
            echo "::error::row-level security probe failed on PostgreSQL ${{ matrix.postgres }}"
            exit 1
          fi

      # Production runs migrations as an ordinary database owner, never a
      # superuser. This job reproduces that: a non-superuser owner, a fresh
      # database, migrations applied twice (the second must be a no-op), and the
      # RLS probe against the result.
      - name: Migrations as a non-superuser owner
        run: |
          set -euo pipefail
          psql -d postgres -c "CREATE DATABASE dawaee_ci OWNER dawaee_migrator"
          export DATABASE_URL="postgres://dawaee_migrator:migratorpw@127.0.0.1:5433/dawaee_ci"
          export DAWAEE_APP_PASSWORD=devpass DAWAEE_WORKER_PASSWORD=devpass
          ./scripts/migrate.sh --preflight-only
          ./scripts/migrate.sh
          ./scripts/migrate.sh | tee /tmp/second.txt
          grep -q 'no pending migrations' /tmp/second.txt || { echo "::error::re-running migrations was not a no-op"; exit 1; }
          psql -d dawaee_ci -f db/seed/rls_probe.sql | tee /tmp/rls-ci.txt
          if grep -q '^ FAIL' /tmp/rls-ci.txt; then
            echo "::error::row-level security probe failed on a non-superuser-owned database"
            exit 1
          fi

      # THE GAP THIS CLOSES. The job above passed for months while the product
      # was unusable on exactly this configuration: a definer function could not
      # write `user_credentials` under FORCE ROW LEVEL SECURITY and registration
      # returned 404. Nothing caught it because the APPLICATION was never started
      # against the database CI had correctly built — only the schema was.
      # A migration-only PASS is not enough.
      - name: Managed-Postgres smoke — the app, on the realistic database
        run: ./scripts/managed-postgres-smoke.sh dawaee_smoke

      # Every suite: RLS matrix, worker privilege boundary, auth/session
      # concurrency, OTP, shared rate limit, worker reliability, endpoint
      # authorization, logging redaction, operational error privacy, audit
      # privacy, and the release-gate manifest that fails if any of them has
      # been deleted. One command, proven by apps/api/test/release-gates.test.ts.
      - name: Unit and integration tests
        run: npm test

      - name: Mobile typecheck
        working-directory: apps/mobile
        run: |
          npm ci --legacy-peer-deps
          npx tsc --noEmit

  # Kept separate from `verify` so a Docker regression is legible on its own,
  # and so it does not run twice across the Postgres matrix.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # The REAL production image, from the real base. P15 could not do this:
      # the sandbox could not pull node:22-bookworm-slim, so the container
      # checks ran against an Ubuntu stand-in and the image that actually
      # deploys had never been built under test.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: dawaee:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.repository.updated_at }}
          # Cache is scoped per-ref by the action. A fork PR writes to its own
          # scope and cannot poison main's.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container security properties
        run: ./scripts/container-checks.sh dawaee:ci

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      # Not `npm audit` directly. The gate separates advisories reachable from
      # the app's own import graph from those reachable only through the Expo
      # CLI and Metro, holds them to different thresholds, and fails on
      # anything outside a dated, documented exception. See
      # docs/CI-SECURITY-GATES.md.
      - name: Dependency gate
        run: node scripts/audit-gate.mjs --workspace all
