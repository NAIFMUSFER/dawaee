name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

# Read-only by default, at the top level, so a job that needs more has to say
# so. Without this block a workflow inherits whatever the repository default
# is — which for repositories created before 2023 is read/write on everything,
# meaning any compromised action in any step could push to main.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        # Production runs PostgreSQL 17 (Supabase). CI ran only 16, so every
        # security property this suite proves was proven against a version the
        # patients' data does not live on. 17 is the one that must pass; 16 is
        # kept because it is what a developer has locally, and a divergence
        # between them is itself worth seeing.
        postgres: ['17', '16']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests deliberately use the bootstrap superuser to reset between
      # cases; the application itself gets TEST_DATABASE_URL below and runs as
      # the same kind of unprivileged owner as production.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/dawaee_test
      TEST_DATABASE_URL: postgres://dawaee_ci_owner:ci-owner-password@127.0.0.1:5433/dawaee_test
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      OTP_PEPPER: ci-only-otp-pepper-at-least-32-bytes
      PASSWORD_PEPPER: ci-only-password-pepper-at-least-32-bytes
      INTERNAL_API_SECRET: ci-only-internal-secret-at-least-32-bytes
      PORT: 8080
      NODE_ENV: test
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /tmp/dawaee-ci-storage
      # The test harness intentionally enables the mock provider. Production
      # is the inverse: fail-closed unless explicitly configured.
      ALLOW_MOCK_PROVIDERS: '1'
      ALLOWED_ORIGINS: http://localhost:3000
      TRUST_PROXY_HOPS: '0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Record the toolchain actually in use
        run: |
          node --version
          npm --version
          test "$(node -p 'process.versions.node.split(`.`)[0]')" = "22"
          test "$(npm --version | cut -d. -f1)" = "10"

      # The hosted runner currently ships psql 16. Against the PG17 service
      # that works for most SQL, but it is not the client production uses and
      # hides version-specific dump/restore behaviour. Install the matching
      # client from the PGDG repository for the 17 lane.
      - name: Install PostgreSQL client matching the server
        if: matrix.postgres == '17'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run npm ci
        run: npm ci
      - name: Build workspace packages
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck

      - name: Prepare test database (realistic ownership)
        env:
          PGPASSWORD: postgres
        run: |
          dropdb -h 127.0.0.1 -p 5433 -U postgres --if-exists dawaee_test
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'dawaee_ci_owner') THEN
              CREATE ROLE dawaee_ci_owner LOGIN PASSWORD 'ci-owner-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            ELSE
              ALTER ROLE dawaee_ci_owner WITH LOGIN PASSWORD 'ci-owner-password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            END IF;
          END
          $do$;
          SQL
          createdb -h 127.0.0.1 -p 5433 -U postgres -O dawaee_ci_owner dawaee_test

      - name: The test database owner must not be able to bypass RLS
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5433 -U postgres -d postgres -Atc \
            "SELECT rolname || ':' || rolsuper || ':' || rolbypassrls FROM pg_roles WHERE rolname='dawaee_ci_owner'" \
            | tee /tmp/owner-role.txt
          grep -qx 'dawaee_ci_owner:false:false' /tmp/owner-role.txt

      - name: Row-level security probe
        env:
          PGPASSWORD: ci-owner-password
        run: |
          psql -h 127.0.0.1 -p 5433 -U dawaee_ci_owner -d dawaee_test -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE ci_rls_probe (id integer PRIMARY KEY, owner_id text NOT NULL);
          ALTER TABLE ci_rls_probe ENABLE ROW LEVEL SECURITY;
          ALTER TABLE ci_rls_probe FORCE ROW LEVEL SECURITY;
          CREATE POLICY ci_rls_probe_policy ON ci_rls_probe
            USING (owner_id = current_setting('app.user_id', true))
            WITH CHECK (owner_id = current_setting('app.user_id', true));
          SET app.user_id = 'alice';
          INSERT INTO ci_rls_probe VALUES (1, 'alice');
          RESET app.user_id;
          DO $do$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM ci_rls_probe;
            IF n <> 0 THEN
              RAISE EXCEPTION 'CI database owner bypasses RLS: % rows visible without context', n;
            END IF;
          END
          $do$;
          DROP TABLE ci_rls_probe;
          SQL

      - name: Migrations as a non-superuser owner
        env:
          DATABASE_URL: postgres://dawaee_ci_owner:ci-owner-password@127.0.0.1:5433/dawaee_test
        run: ./scripts/migrate.sh

      # This is the closest reproducible analogue to the managed production
      # database: the API and worker boot on the exact migrated database, owned
      # by a role that cannot bypass RLS. It catches a migration that is valid
      # SQL but leaves the real processes unable to start.
      - name: Managed-Postgres smoke — the app, on the realistic database
        env:
          DATABASE_URL: postgres://dawaee_ci_owner:ci-owner-password@127.0.0.1:5433/dawaee_test
        run: |
          node apps/api/dist/server.js > /tmp/api.log 2>&1 &
          api_pid=$!
          trap 'kill $api_pid 2>/dev/null || true; cat /tmp/api.log' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/tmp/ready.json; then break; fi
            sleep 1
          done
          cat /tmp/ready.json
          grep -q '"ready":true' /tmp/ready.json
          kill $api_pid
          wait $api_pid || true
          trap - EXIT

          timeout 8s node apps/worker/dist/worker.js > /tmp/worker.log 2>&1 || rc=$?
          cat /tmp/worker.log
          test "${rc:-0}" = 124 || test "${rc:-0}" = 0
          grep -q 'worker started' /tmp/worker.log

      - name: Install mobile dependencies for root Vitest collection
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Unit and integration tests
        run: npm test

      - name: Mobile typecheck
        working-directory: apps/mobile
        run: npm run typecheck

  # The Dockerfile used to exist as documentation only: CI never built it. A
  # broken COPY path, missing runtime file, or root-user regression could all
  # reach Render without a single gate noticing. Build the *actual* image and
  # assert the properties the deployment depends on.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the production image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: dawaee:ci
          build-args: |
            GIT_COMMIT=${{ github.sha }}
      - name: Container security properties
        run: |
          test "$(docker image inspect dawaee:ci -f '{{.Config.User}}')" = '1001:1001'
          test "$(docker run --rm --entrypoint sh dawaee:ci -c 'id -u')" = '1001'
          docker run --rm --entrypoint sh dawaee:ci -c 'test ! -e /usr/local/bin/npm && test ! -e /usr/local/bin/npx'
          docker run --rm --entrypoint sh dawaee:ci -c 'test -x /app/scripts/migrate.sh && test -r /app/db/migrations/0030_upload_storage_metadata.sql'
          docker run --rm --entrypoint node dawaee:ci -e "require('./apps/api/dist/app.js'); require('./apps/worker/dist/worker.js')"

  # Supply-chain gate. `npm ci` proving that a lockfile installs is not the
  # same as proving that what it installs is safe. The accepted baseline lives
  # in scripts/audit-gate.mjs; any *new* HIGH/CRITICAL advisory fails here.
  # This makes the documented exceptions executable instead of aspirational.
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Run npm ci
        run: npm ci
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps
      - name: Dependency gate
        run: node scripts/audit-gate.mjs --workspace all

  # Mobile is a release artifact, not just TypeScript. A compile-only check can
  # pass while Metro cannot resolve the workspace packages or a native module
  # is incompatible with the Expo SDK. Exporting both native bundles exercises
  # the actual production bundler without requiring signing credentials.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      EXPO_PUBLIC_API_URL: https://dawaee-api.onrender.com
      EXPO_PUBLIC_DEMO: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Run npm ci
        run: npm ci
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps
      - name: Mobile typecheck
        working-directory: apps/mobile
        run: npm run typecheck
      - name: Native release identity and safety configuration
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('apps/mobile/app.json', 'utf8')).expo;
          const eas = JSON.parse(fs.readFileSync('apps/mobile/eas.json', 'utf8'));
          const androidPerms = new Set(app.android?.permissions ?? []);
          const forbidden = ['READ_EXTERNAL_STORAGE', 'WRITE_EXTERNAL_STORAGE', 'MANAGE_EXTERNAL_STORAGE'];
          const present = forbidden.filter((p) => androidPerms.has(p));
          if (present.length) throw new Error(`forbidden Android storage permissions: ${present.join(', ')}`);
          if (app.android?.allowBackup !== false) throw new Error('android.allowBackup must be false');
          if (!Number.isInteger(app.android?.versionCode) || app.android.versionCode < 1) throw new Error('android.versionCode missing');
          if (!/^\d+$/.test(String(app.ios?.buildNumber ?? ''))) throw new Error('ios.buildNumber missing');
          if (eas.build?.production?.env?.EXPO_PUBLIC_API_URL !== 'https://dawaee-api.onrender.com') throw new Error('production EAS API URL is not pinned');
          if (eas.build?.production?.env?.EXPO_PUBLIC_DEMO !== '0') throw new Error('production EAS demo mode must be off');
          console.log(`android.versionCode=${app.android.versionCode}`);
          console.log(`ios.buildNumber=${app.ios.buildNumber}`);
          NODE
      - name: Export Android production bundle
        working-directory: apps/mobile
        run: npx expo export --platform android --output-dir dist-ci-android
      - name: Export iOS production bundle
        working-directory: apps/mobile
        run: npx expo export --platform ios --output-dir dist-ci-ios
