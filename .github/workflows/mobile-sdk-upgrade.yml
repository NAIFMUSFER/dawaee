name: Mobile SDK 55 final validation

on:
  push:
    branches: [mobile/expo55-store-readiness]
    paths:
      - '.github/workflows/mobile-sdk-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
  EXPO_PUBLIC_API_URL: https://dawaee-api.onrender.com
  EXPO_PUBLIC_DEMO: '0'

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/expo55-store-readiness

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: Final SDK 55 gates
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx expo install --check --npm
          npx expo-doctor@latest
          npx tsc --noEmit
          npm audit --omit=dev --audit-level=high
          node -e "require.resolve('expo-system-ui'); console.log('expo-system-ui resolved')"

      - name: Reject legacy Expo file-system calls
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          if grep -R -n -E "FileSystem\.(copyAsync|createDownloadResumable|createUploadTask|getContentUriAsync|getFreeDiskStorageAsync|getInfoAsync|makeDirectoryAsync|moveAsync|readAsStringAsync|writeAsStringAsync|deleteAsync|downloadAsync|documentDirectory|cacheDirectory)|fileSystem\.(documentDirectory|cacheDirectory|writeAsStringAsync|readAsStringAsync|downloadAsync|deleteAsync|moveAsync|copyAsync|getInfoAsync)" app src; then
            echo '::error::legacy expo-file-system API remains in shipped mobile code'
            exit 1
          fi
          echo 'No legacy expo-file-system calls remain.'

      - name: Export final production bundles
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          rm -rf .final-validation
          npx expo export --platform android --output-dir .final-validation/android
          npx expo export --platform ios --output-dir .final-validation/ios
          test -f .final-validation/android/metadata.json
          test -f .final-validation/ios/metadata.json
          rm -rf .final-validation

      - name: Final native config generation
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: |
          set -euo pipefail
          npx expo prebuild --clean --no-install --platform all
          test -f android/app/build.gradle
          test -f ios/Podfile
