name: Mobile SDK 55 native validation

on:
  push:
    branches: [mobile/expo55-store-readiness]
    paths:
      - '.github/workflows/mobile-sdk-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-sdk55-native-validation
  cancel-in-progress: true

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
  EXPO_PUBLIC_API_URL: https://dawaee-api.onrender.com
  EXPO_PUBLIC_DEMO: '0'

jobs:
  js-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/expo55-store-readiness

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Install repository dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps

      - name: SDK 55 compatibility gates
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx expo install --check --npm
          npx expo-doctor@latest
          npx tsc --noEmit
          npm audit --omit=dev --audit-level=high

      - name: Surface removed or legacy Expo API usage
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          echo '--- expo-file-system imports/usages ---'
          grep -R -n -E "expo-file-system|FileSystem\.(copyAsync|createDownloadResumable|createUploadTask|getContentUriAsync|getFreeDiskStorageAsync|getInfoAsync|makeDirectoryAsync|moveAsync|readAsStringAsync|writeAsStringAsync|deleteAsync|downloadAsync|documentDirectory|cacheDirectory)" app src || true
          echo '--- removed/deprecated SDK 55 config/API markers ---'
          grep -R -n -E "newArchEnabled|edgeToEdgeEnabled|ExpoRequest|ExpoResponse|allowsFullscreen|experimentalBlurMethod" app src app.json || true

      - name: Export production bundles
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          rm -rf .native-validation
          npx expo export --platform android --output-dir .native-validation/android
          npx expo export --platform ios --output-dir .native-validation/ios
          test -f .native-validation/android/metadata.json
          test -f .native-validation/ios/metadata.json
          rm -rf .native-validation

      - name: Generate both native projects from app config
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: |
          set -euo pipefail
          npx expo prebuild --clean --no-install --platform all
          test -f android/app/build.gradle
          test -f ios/Podfile

  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/expo55-store-readiness

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          npm ci
          cd apps/mobile
          npm ci --legacy-peer-deps

      - name: Generate Android native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --clean --no-install --platform android

      - name: Compile Android release AAB
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ./gradlew :app:bundleRelease --no-daemon
          test -f app/build/outputs/bundle/release/app-release.aab
          ls -lh app/build/outputs/bundle/release/app-release.aab

  ios-release-simulator:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/expo55-store-readiness

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json

      - name: Pin the SDK 55 store toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: |
          npm ci
          cd apps/mobile
          npm ci --legacy-peer-deps

      - name: Generate iOS native project
        working-directory: apps/mobile
        env:
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --clean --no-install --platform ios

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: pod install

      - name: Compile iOS Release simulator app
        working-directory: apps/mobile
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          set -euo pipefail
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          project="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$workspace"
          test -n "$project"
          scheme="$(basename "$project" .xcodeproj)"
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
          find ios/build/Build/Products -maxdepth 2 -name '*.app' -print -quit | grep -q .
