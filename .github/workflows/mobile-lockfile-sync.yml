name: Mobile lockfile sync

on:
  push:
    branches:
      - audit/caregiver-push-routing-2026-09-14
    paths:
      - apps/mobile/package.json

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Regenerate mobile lockfile only
        working-directory: apps/mobile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile if changed
        shell: bash
        run: |
          if git diff --quiet -- apps/mobile/package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package-lock.json
          git commit -m "chore(mobile): sync Firebase dependency lockfile"
          git push origin HEAD:audit/caregiver-push-routing-2026-09-14
