name: Android native build

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_DEMO: '0'
      EXPO_PUBLIC_API_URL: https://example.invalid
    steps:
      # Compile the exact candidate, not a different source tree or an EAS
      # project chosen implicitly from an account. No production credentials.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Install locked mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps
      - name: Verify Android local-module resolution
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx --no-install expo-modules-autolinking resolve --platform android --json > "$RUNNER_TEMP/expo-android-autolinking.json"
          node - "$RUNNER_TEMP/expo-android-autolinking.json" <<'NODE'
          const fs = require('node:fs');
          const resolved = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = 'app.dawaee.exactalarm.ExactAlarmAccessModule';
          if (!JSON.stringify(resolved).includes(JSON.stringify(expected))) {
            throw new Error('ExactAlarmAccessModule is missing from actual Android autolinking resolution');
          }
          console.log('Android autolinking resolves the exact-alarm module');
          NODE
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx --no-install expo prebuild --platform android --no-install --skip-dependency-update react-native,react
      - name: Compile and package the debug APK
        working-directory: apps/mobile/android
        # Debug signing uses the generated development key, never store keys.
        # This is a compile/package gate: no device install, server or upload.
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --max-workers=2 -PreactNativeArchitectures=arm64-v8a '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Verify generated registration and packaged native code
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = 'app.dawaee.exactalarm.ExactAlarmAccessModule';
          const matches = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (/^ExpoModulesPackageList\.(java|kt)$/.test(entry.name)
                && fs.readFileSync(file, 'utf8').includes(expected)) matches.push(file);
            }
          }
          walk('android');
          walk('node_modules/expo/android/build');
          if (matches.length === 0) throw new Error('Built Expo module registration omits the exact-alarm class');
          console.log('Generated registration verified:', matches.join(', '));
          NODE
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$ANALYZER" ]; then
            ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"
          fi
          test -n "$ANALYZER" && test -x "$ANALYZER"
          "$ANALYZER" dex code --class app.dawaee.exactalarm.ExactAlarmAccessModule "$APK" > "$RUNNER_TEMP/exact-alarm-dex.txt"
          test -s "$RUNNER_TEMP/exact-alarm-dex.txt"
          "$ANALYZER" manifest permissions "$APK" > "$RUNNER_TEMP/android-permissions.txt"
          grep -Fxq 'android.permission.SCHEDULE_EXACT_ALARM' "$RUNNER_TEMP/android-permissions.txt"
          if grep -Fxq 'android.permission.USE_EXACT_ALARM' "$RUNNER_TEMP/android-permissions.txt"; then
            echo '::error::Restricted USE_EXACT_ALARM permission reappeared in the packaged APK'
            exit 1
          fi
          echo "Verified candidate $(git rev-parse HEAD)"
          sha256sum "$APK"
          echo 'Native compilation/packaging passed; device behavior and real push delivery are NOT proven by this job.'
