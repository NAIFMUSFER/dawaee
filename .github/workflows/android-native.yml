name: Android native build

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

permissions:
  contents: read

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_DEMO: '0'
      EXPO_PUBLIC_API_URL: https://example.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Install locked mobile dependencies
        working-directory: apps/mobile
        run: npm ci --legacy-peer-deps
      - name: Verify Android local-module resolution
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          npx --no-install expo-modules-autolinking resolve --platform android --json > "$RUNNER_TEMP/expo-android-autolinking.json"
          node - "$RUNNER_TEMP/expo-android-autolinking.json" <<'NODE'
          const fs = require('node:fs');
          const resolved = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const expected = 'app.dawaee.exactalarm.ExactAlarmAccessModule';
          if (!JSON.stringify(resolved).includes(JSON.stringify(expected))) throw new Error('ExactAlarmAccessModule is missing from actual Android autolinking resolution');
          console.log('Android autolinking resolves the exact-alarm module');
          NODE
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx --no-install expo prebuild --platform android --no-install --skip-dependency-update react-native,react
      - name: Compile and package the release APK and app bundle
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --console=plain --max-workers=2 -PreactNativeArchitectures=arm64-v8a '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'
      - name: Verify generated registration and release artifacts
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const expected = 'app.dawaee.exactalarm.ExactAlarmAccessModule';
          const matches = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const file = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(file);
              else if (/^ExpoModulesPackageList\.(java|kt)$/.test(entry.name) && fs.readFileSync(file, 'utf8').includes(expected)) matches.push(file);
            }
          }
          walk('android');
          walk('node_modules/expo/android/build');
          if (matches.length === 0) throw new Error('Built Expo module registration omits the exact-alarm class');
          console.log('Generated registration verified:', matches.join(', '));
          NODE
          APK=android/app/build/outputs/apk/release/app-release.apk
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          ANALYZER="$(command -v apkanalyzer || true)"
          if [ -z "$ANALYZER" ]; then ANALYZER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name apkanalyzer -print -quit)"; fi
          test -n "$ANALYZER" && test -x "$ANALYZER"
          "$ANALYZER" dex code --class app.dawaee.exactalarm.ExactAlarmAccessModule "$APK" > "$RUNNER_TEMP/exact-alarm-release-dex.txt"
          test -s "$RUNNER_TEMP/exact-alarm-release-dex.txt"
          "$ANALYZER" dex code --class app.dawaee.exactalarm.ExactAlarmPermissionReceiver "$APK" > "$RUNNER_TEMP/exact-alarm-receiver-release-dex.txt"
          test -s "$RUNNER_TEMP/exact-alarm-receiver-release-dex.txt"
          "$ANALYZER" dex code --class app.dawaee.exactalarm.ExactAlarmRecoveryJobService "$APK" > "$RUNNER_TEMP/exact-alarm-recovery-job-release-dex.txt"
          test -s "$RUNNER_TEMP/exact-alarm-recovery-job-release-dex.txt"
          "$ANALYZER" manifest print "$APK" > "$RUNNER_TEMP/android-release-manifest.xml"
          grep -Fq 'app.dawaee.exactalarm.ExactAlarmPermissionReceiver' "$RUNNER_TEMP/android-release-manifest.xml"
          grep -Fq 'android.app.action.SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED' "$RUNNER_TEMP/android-release-manifest.xml"
          grep -Fq 'app.dawaee.exactalarm.ExactAlarmRecoveryJobService' "$RUNNER_TEMP/android-release-manifest.xml"
          grep -Fq 'android.permission.BIND_JOB_SERVICE' "$RUNNER_TEMP/android-release-manifest.xml"
          "$ANALYZER" manifest permissions "$APK" > "$RUNNER_TEMP/android-release-permissions.txt"
          grep -Fxq 'android.permission.SCHEDULE_EXACT_ALARM' "$RUNNER_TEMP/android-release-permissions.txt"
          if grep -Fxq 'android.permission.USE_EXACT_ALARM' "$RUNNER_TEMP/android-release-permissions.txt"; then echo '::error::Restricted USE_EXACT_ALARM permission reappeared in the release APK'; exit 1; fi
          unzip -l "$AAB" | grep -Eq 'base/dex/classes([0-9]+)?\.dex'
          echo "Verified release candidate $(git rev-parse HEAD)"
          sha256sum "$APK" "$AAB" | tee android/release-sha256.txt
      - name: Upload verified native build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-native-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile/android/release-sha256.txt
          if-no-files-found: error
          retention-days: 7
